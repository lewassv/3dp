<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualisasi 3D Anatomi Tumbuhan (Standalone)</title>
    <meta name="description" content="Aplikasi 3D Anatomi Tumbuhan Standalone Single-File menggunakan Three.js. Siap copy-paste!">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { width: 100vw; height: 100vh; overflow: hidden; background-color: #0a0f0d; color: #f3f4f6; font-family: 'Plus Jakarta Sans', sans-serif; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; cursor: grab; }
        .glass-card { background: rgba(18, 28, 23, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(52, 211, 153, 0.2); border-radius: 16px; padding: 18px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
        .app-header { position: absolute; top: 20px; left: 20px; z-index: 10; display: flex; align-items: center; gap: 12px; }
        .logo-icon { width: 38px; height: 38px; border-radius: 10px; background: linear-gradient(135deg, #10b981, #047857); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 1.2rem; }
        .logo-text h1 { font-size: 1.1rem; font-weight: 800; }
        .logo-text p { font-size: 0.72rem; color: #9ca3af; }
        .left-panel { position: absolute; top: 90px; left: 20px; width: 280px; z-index: 10; display: flex; flex-direction: column; gap: 12px; }
        .nav-btn { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; color: #fff; cursor: pointer; text-align: left; transition: all 0.2s; }
        .nav-btn:hover { background: rgba(52, 211, 153, 0.15); border-color: #10b981; }
        .nav-btn.active { background: linear-gradient(135deg, rgba(16,185,129,0.3), rgba(5,150,105,0.2)); border-color: #10b981; }
        .info-panel { position: absolute; top: 90px; right: 20px; width: 320px; z-index: 10; }
        .info-header h2 { font-size: 1.2rem; color: #34d399; margin-bottom: 8px; }
        .info-summary { font-size: 0.85rem; color: #9ca3af; line-height: 1.5; margin-bottom: 12px; }
        .info-list { font-size: 0.8rem; color: #d1d5db; padding-left: 16px; line-height: 1.5; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <header class="app-header glass-card">
        <div class="logo-icon"><i class="fa-solid fa-seedling"></i></div>
        <div class="logo-text">
            <h1>Plant3D <span style="color:#34d399;">Standalone</span></h1>
            <p>Salin & Tempel Langsung</p>
        </div>
    </header>

    <aside class="left-panel glass-card">
        <button class="nav-btn active" onclick="selectPart('all')"><i class="fa-solid fa-globe"></i> Tumbuhan Utuh</button>
        <button class="nav-btn" onclick="selectPart('flower')"><i class="fa-solid fa-fan" style="color:#fb7185;"></i> Bunga (Flower)</button>
        <button class="nav-btn" onclick="selectPart('fruit')"><i class="fa-solid fa-apple-whole" style="color:#fbbf24;"></i> Buah & Biji (Fruit)</button>
        <button class="nav-btn" onclick="selectPart('leaf')"><i class="fa-solid fa-leaf" style="color:#34d399;"></i> Daun (Leaves)</button>
        <button class="nav-btn" onclick="selectPart('stem')"><i class="fa-solid fa-bars-staggered" style="color:#10b981;"></i> Batang (Stem)</button>
        <button class="nav-btn" onclick="selectPart('root')"><i class="fa-solid fa-route" style="color:#f59e0b;"></i> Akar (Roots)</button>
    </aside>

    <section class="info-panel glass-card">
        <div class="info-header">
            <h2 id="infoTitle">Tumbuhan Utuh</h2>
        </div>
        <p class="info-summary" id="infoSummary">Tumbuhan adalah organisme multiseluler kompleks. Setiap bagian bekerja harmonis untuk pertumbuhan dan reproduksi.</p>
        <ul class="info-list" id="infoList">
            <li>Akar: Menyerap air dan hara.</li>
            <li>Batang: Menopang dan mengangkut nutrisi.</li>
            <li>Daun: Tempat berlangsungnya fotosintesis.</li>
        </ul>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0f0d);
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.0, 7.5);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const sun = new THREE.DirectionalLight(0xfff5ea, 1.4);
        sun.position.set(5, 10, 6);
        scene.add(sun);

        const plantGroup = new THREE.Group();
        scene.add(plantGroup);

        // Soil
        const soil = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 1.8, 2, 32), new THREE.MeshStandardMaterial({ color: 0x2e1c14, roughness: 0.9 }));
        soil.position.y = -1.5;
        scene.add(soil);

        // Stem
        const stemCurve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(0, -0.45, 0), new THREE.Vector3(0.05, 0.5, 0.02),
            new THREE.Vector3(-0.08, 1.4, -0.04), new THREE.Vector3(0, 3.1, 0)
        ]);
        const stem = new THREE.Mesh(new THREE.TubeGeometry(stemCurve, 32, 0.12, 12), new THREE.MeshStandardMaterial({ color: 0x059669 }));
        plantGroup.add(stem);

        // Flower
        const flowerGroup = new THREE.Group();
        flowerGroup.position.set(0, 3.1, 0);
        const petalGeo = new THREE.SphereGeometry(0.3, 16, 16);
        petalGeo.scale(0.5, 1.2, 0.2);
        const petalMat = new THREE.MeshStandardMaterial({ color: 0xf43f5e });
        for(let i=0; i<6; i++) {
            const p = new THREE.Mesh(petalGeo, petalMat);
            p.rotation.z = (i/6)*Math.PI*2;
            p.rotation.x = 0.3;
            flowerGroup.add(p);
        }
        plantGroup.add(flowerGroup);

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        function selectPart(part) {
            alert('Fokus ke bagian: ' + part);
        }
    </script>
</body>
</html>
